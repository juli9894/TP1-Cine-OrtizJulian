<div class="tarjeta-formulario">
    <h2>{{ esEdicion() ? 'Editar producto' : 'Nuevo producto' }}</h2>

    <form [formGroup]="formularioProducto" (ngSubmit)="guardar()">
        <label>
            Nombre
            <input type="text" formControlName="nombre" />
        </label>

        <label>
            Categoría
            <input type="text" formControlName="categoria" />
        </label>

        <label>
            Precio
            <input type="number" formControlName="precio" />
        </label>

        @if (errorMensaje()) {
            <p class="error">{{ errorMensaje() }}</p>
        }

        <div class="acciones-formulario">
            <button type="submit" [disabled]="formularioProducto.invalid">Guardar</button>
            <a routerLink="/admin/productos">Cancelar</a>
        </div>
    </form>
</div>
