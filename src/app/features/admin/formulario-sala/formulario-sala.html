<div class="tarjeta-formulario">
    <h2>{{ esEdicion() ? 'Editar sala' : 'Nueva sala' }}</h2>

    <form [formGroup]="formularioSala" (ngSubmit)="guardar()">
        <label>
            Nombre
            <input type="text" formControlName="nombre" />
        </label>

        @if (errorMensaje()) {
            <p class="error">{{ errorMensaje() }}</p>
        }

        <div class="acciones-formulario">
            <button type="submit" [disabled]="formularioSala.invalid">Guardar</button>
            <a routerLink="/admin/salas">Cancelar</a>
        </div>
    </form>
</div>
