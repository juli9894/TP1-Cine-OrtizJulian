    <div class="registro">
    <h2>Registrarme</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
        Email
        <input type="email" formControlName="email" />
        </label>

        <label>
        Contraseña
        <input type="password" formControlName="password" />
        </label>

        <label>
        Nombre
        <input type="text" formControlName="nombre" />
        </label>

        <label>
        Apellido
        <input type="text" formControlName="apellido" />
        </label>

        <label>
        Fecha de nacimiento
        <input type="date" formControlName="fechaNacimiento" />
        </label>

        <label>
        Tipo de sangre
        <input type="text" formControlName="tipoSangre" placeholder="ej: A+" />
        </label>

        <label>
        Color de ojos
        <input type="text" formControlName="colorOjos" />
        </label>

        <label>
        Días de vacaciones por año
        <input type="number" formControlName="diasVacaciones" />
        </label>

        @if (errorMensaje) {
        <p class="error">{{ errorMensaje }}</p>
        }

        <button type="submit" [disabled]="form.invalid">Registrarme</button>
    </form>
    </div>
