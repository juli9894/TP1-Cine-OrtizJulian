<header class="barra-superior">
    <span class="logo">🎬 TP Cine</span>

    @if (authService.usuarioActual(); as usuario) {
        <div class="sesion">
            <span>{{ usuario.email }}</span>
            <a routerLink="/mis-reservas">Mis reservas</a>
            <button (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
    } @else {
        <span class="sesion-vacia">No estás logueado</span>
    }
</header>

<main>
    <router-outlet />
</main>
